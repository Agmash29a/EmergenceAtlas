name: Build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build EmergenceAtlas.sln --configuration Release
      - name: Run deterministic tests
        run: dotnet run --project tests/EmergenceAtlas.Tests --configuration Release --no-build
